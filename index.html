<style>

const S={
en:`Welcome! Let’s grow your shop|Choose language|What is your business?|Mobile number|Enter 4-digit OTP|Continue|Tell us about your shop|Shop name|Your name|Years in business|Hello|Sales|Expenses|Profit|Last 8 months|Next best step|Home|Add|Loan Ready|Money Owed|Speak your entry|Scan a bill|Save|Cash|UPI|Credit|Stock|Rent|Wages|Other|Month|Amount (₹)|steps to go|Fix now|Done|Send WhatsApp reminder|Loan schemes for you|Share my profile with a lender|Yes|Edit|Regular monthly sales|6+ months of records|Expenses noted every month|Udyam registration|Bank statement|Milestone reached!|Final eligibility is decided by the lender.|Registered suppliers should be paid within 45 days.|Prototype with sample data. Not connected to real banks or lenders.|Loan Ready score|Prepare my documents|Share your profile with this lender?|Yes, share|days late|May qualify|Almost there`,
hi:`स्वागत है! आइए आपकी दुकान बढ़ाएँ|भाषा चुनें|आपका काम क्या है?|मोबाइल नंबर|4 अंकों का OTP डालें|आगे बढ़ें|अपनी दुकान के बारे में बताएँ|दुकान का नाम|आपका नाम|कितने साल से काम|नमस्ते|बिक्री|खर्च|मुनाफ़ा|पिछले 8 महीने|अगला सही कदम|होम|जोड़ें|लोन तैयारी|बकाया पैसा|बोलकर लिखें|बिल स्कैन करें|सेव करें|नकद|UPI|उधार|माल|किराया|मज़दूरी|अन्य|महीना|रकम (₹)|कदम बाकी|अभी ठीक करें|हो गया|WhatsApp रिमाइंडर भेजें|आपके लिए लोन योजनाएँ|मेरी प्रोफ़ाइल लेंडर को भेजें|हाँ|बदलें|हर महीने नियमित बिक्री|6+ महीने का रिकॉर्ड|हर महीने खर्च दर्ज|उद्यम रजिस्ट्रेशन|बैंक स्टेटमेंट|पड़ाव पूरा हुआ!|अंतिम पात्रता का फ़ैसला लेंडर करता है।|पंजीकृत सप्लायर को 45 दिन में भुगतान होना चाहिए।|सैंपल डेटा वाला प्रोटोटाइप। असली बैंक या लेंडर से जुड़ा नहीं।|लोन तैयारी स्कोर|मेरे दस्तावेज़ तैयार करें|क्या यह लेंडर आपकी प्रोफ़ाइल देखे?|हाँ, भेजें|दिन देर|पात्र हो सकते हैं|लगभग तैयार`,

 const pay=sm(cs.filter(x=>x.type=='payment')),bal=Math.max(sm(cr)-pay,0);let rem=pay,old=null;
 cr.forEach(x=>{if(rem>=x.amt)rem-=x.amt;else if(!old)old=x.date});
 const od=old&&bal>0?Math.max(0,Math.floor((new Date()-pd(old))/864e5)-30):0;return{bal,od,old}}

 const hs=ms.filter(k=>mS[k]>0),miss=hs.filter(k=>!mE[k]),l3=ms.slice(3),S3=l3.reduce((a,k)=>a+(mS[k]||0),0),E3=l3.reduce((a,k)=>a+(mE[k]||0),0);
 const bs=D.cust.map(c=>custBal(c.name)),out=bs.reduce((a,b)=>a+b.bal,0),od=bs.reduce((a,b)=>a+(b.od>0?b.bal:0),0),p=D.p||{};
 const pf=['name','owner','loc','years'].filter(k=>p[k]).length/4;
 return{miss,cons:hs.length/6,expm:hs.length?(hs.length-miss.length)/hs.length:0,prof:S3?cl((S3-E3)/S3/.25):0,coll:cl(1-od/Math.max(1,.25*S3)),comp:.4*pf+.2*(D.bills.length>0)+.2*D.docs.aadhaar+.2*D.docs.pan,act:cl(D.tx.filter(x=>x.date>=ago(30)).length/15),out,od,nrec:new Set(D.tx.map(x=>x.date.slice(0,7))).size}}

 if(/received|got .* from|paid me|collected/.test(l)){type='payment';cat='Payment';const m=l.match(/from\s+([a-z]+)/);cust=m?m[1][0].toUpperCase()+m[1].slice(1):''}
 else if(/paid|bought|spent|purchase|rent|salary|wage|bill/.test(l)){type='expense';cat=/rent/.test(l)?'Rent':/salary|wage/.test(l)?'Wages':/electric|water|bill/.test(l)?'Utilities':/inventory|stock|fabric|material|goods/.test(l)?'Stock':'Other'}
 else if(/credit|udhaar/.test(l))method='credit';
 return{type,amt:a,cat,desc:s,method,cust,heard:s}}
function voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){modal(`<h2>Voice not available</h2><p>This browser does not support speech recognition. Please use manual entry.</p><button class="btn" onclick="txForm()">Manual entry</button>`);return}
 modal(`<h2>${t(20)}</h2><p id="vs">Listening… say “Sold three shirts for 1,500 rupees”.</p><button class="btn2" onclick="closeM()">✕</button>`);
 const r=new SR();r.lang=LOC[st.l];r.onresult=e=>txForm(null,parseV(e.results[0][0].transcript));
 r.onerror=e=>{if($('vs'))$('vs').innerHTML=`Could not hear you (${esc(e.error)}). <br><button class="btn" onclick="txForm()">Manual entry</button>`};
 try{r.start()}catch(e){$('vs').textContent='Could not start the microphone.'}}
function bill(){modal(`<h2>${t(21)}</h2><p class="mut s">Bizzy does not read bills automatically (no OCR). Add a photo, then type the details shown on the bill.</p><input type="file" accept="image/*" capture="environment" class="in" onchange="bf(this)"><div id="bp"></div><button class="btn2" onclick="closeM()">✕</button>`)}
function bf(i){const f=i.files[0];if(!f)return;const rd=new FileReader();rd.onerror=()=>toast('Could not read the file');
 rd.onload=()=>{const im=new Image();im.onerror=()=>toast('That file is not a valid image');
  im.onload=()=>{const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);window._bi=c.toDataURL('image/jpeg',.6);
   $('bp').innerHTML=`<img class="pv" src="${_bi}" alt="Bill preview"><label>Supplier / description</label><input id="b_de" class="in" maxlength="80"><label>${t(31)}</label><input id="b_am" class="in" type="number" min="1"><label>Date</label><input id="b_dt" class="in" type="date" max="${today()}" value="${today()}"><div id="fe" class="red s"></div><button class="btn" onclick="bs()">${t(22)}</button>`};im.src=rd.result};rd.readAsDataURL(f)}
function bs(){const am=+val('b_am'),dt=val('b_dt'),de=val('b_de');if(!(am>0))return $('fe').textContent='Enter the bill amount.';if(!dt||dt>today())return $('fe').textContent='Choose a valid date.';
 const tid=D.seq++;D.tx.push({id:tid,date:dt,type:'expense',amt:Math.round(am),cat:'Stock',desc:de||'Bill',method:'cash',cust:''});D.bills.push({id:D.seq++,date:dt,amt:Math.round(am),desc:de||'Bill',img:window._bi,tx:tid});save();closeM();toast('Expense and bill saved');render()}

function saveCust(){const n=val('c_n'),p=val('c_p');if(!n)return $('fe').textContent='Enter a name.';if(p&&!/^\d{10}$/.test(p))return $('fe').textContent='Mobile number must be 10 digits.';if(D.cust.some(c=>c.name.toLowerCase()==n.toLowerCase()))return $('fe').textContent='This customer already exists.';

 if(id)Object.assign(D.prod.find(x=>x.id==id),r);else D.prod.push(Object.assign({id:D.seq++},r));save();closeM();render()}

/* --- Reports --- */
function repData(){const k=st.rp.t,d=st.rp.d||today(),mo=st.rp.m||today().slice(0,7),T=D.tx,ms=T.filter(x=>x.date.slice(0,7)==mo);
 if(k=='daily'){const L=T.filter(x=>x.date==d&&x.type=='sale');return{title:'Daily sales report, '+d,head:['Description','Method','Customer','Amount'],cur:[3],rows:L.map(x=>[x.desc,x.method,x.cust,x.amt]),tot:['Total','','',sm(L)]}}
 if(k=='month'){const s=sm(ms.filter(x=>x.type=='sale')),e=sm(ms.filter(x=>x.type=='expense')),p=sm(ms.filter(x=>x.type=='payment'));return{title:'Monthly financial report, '+mo,head:['Item','Amount'],cur:[1],rows:[['Sales',s],['Expenses',e],['Net profit',s-e],['Customer payments received',p]],tot:null}}
 if(k=='pl'){const ks=[...new Set(T.map(x=>x.date.slice(0,7)))].sort().slice(-6),rows=ks.map(m=>{const s=sm(T.filter(x=>x.date.slice(0,7)==m&&x.type=='sale')),e=sm(T.filter(x=>x.date.slice(0,7)==m&&x.type=='expense'));return[m,s,e,s-e]});return{title:'Profit and loss summary (last 6 months with records)',head:['Month','Revenue','Expenses','Profit'],cur:[1,2,3],rows,tot:['Total',...[1,2,3].map(i=>rows.reduce((a,r)=>a+r[i],0))]}}
 if(k=='exp'){const L=ms.filter(x=>x.type=='expense');return{title:'Expense report, '+mo,head:['Date','Description','Category','Amount'],cur:[3],rows:L.map(x=>[x.date,x.desc,x.cat,x.amt]),tot:['Total','','',sm(L)]}}
 if(k=='out'){const rows=D.cust.map(c=>({c,...custBal(c.name)})).filter(r=>r.bal>0).map(r=>[r.c.name,r.bal,r.od]);return{title:'Customer outstanding report, '+today(),head:['Customer','Balance','Days overdue'],cur:[1],rows,tot:['Total',rows.reduce((a,r)=>a+r[1],0),'']}}
 const r=ready();return{title:'Loan readiness report, '+today()+' (indicative internal assessment, not a credit score)',head:['Category','Weight','Points'],cur:[],rows:r.w.map(w=>[w[0],w[1],Math.round(w[1]*w[2])]),tot:['Overall',100,r.s]}}
function rep(){const p=st.rp,TY=[['daily','Daily sales'],['month','Monthly financial'],['pl','Profit and loss'],['exp','Expenses'],['out','Customer outstanding'],['loan','Loan readiness']],d=repData(),f=(v,i)=>d.cur.includes(i)&&typeof v=='number'?R(v):esc(v);
 return`<div class="top noprint"><h2>Reports</h2></div><div class="card noprint filt"><select aria-label="Report" onchange="st.rp.t=this.value;render()">${TY.map(([k,n])=>`<option value="${k}" ${p.t==k?'selected':''}>${n}</option>`).join('')}</select>${p.t=='daily'?`<input class="in" type="date" max="${today()}" value="${p.d||today()}" onchange="st.rp.d=this.value;render()">`:['month','exp'].includes(p.t)?`<input class="in" type="month" value="${p.m||today().slice(0,7)}" onchange="st.rp.m=this.value;render()">`:''}<button class="btn sm" onclick="print()">Print</button><button class="btn2 sm" style="margin:0" onclick="csv()">Export CSV</button></div>
<div class="card"><h3 style="margin-top:0">${esc(D.p.name)} · ${esc(d.title)}</h3>${d.rows.length?`<div class="tw"><table><tr>${d.head.map((h,i)=>`<th class="${d.cur.includes(i)?'n':''}">${h}</th>`).join('')}</tr>${d.rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${d.cur.includes(i)?'n':''}">${f(v,i)}</td>`).join('')}</tr>`).join('')}${d.tot?`<tr>${d.tot.map((v,i)=>`<td class="${d.cur.includes(i)?'n':''}"><b>${f(v,i)}</b></td>`).join('')}</tr>`:''}</table></div>`:empty('No records for this report and period.')}</div>`}

function imp(i){const f=i.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);
 if(!o||!o.p||!Array.isArray(o.tx)||!o.tx.every(x=>x&&typeof x.amt=='number'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&['sale','expense','payment'].includes(x.type)))throw 0;
 D=Object.assign(blank(),o);D.seq=Math.max(D.seq||1,...[...D.tx,...D.cust,...D.prod,...D.bills].map(x=>x.id||0))+1;save();toast('Backup restored');render()}catch(e){toast('That file is not a valid Bizzy backup')}};rd.readAsText(f)}
function reset(){if(confirm('Erase ALL Bizzy data in this browser? This cannot be undone.')){D=null;DB.set('data',null).catch(()=>{});st.o={name:'',owner:'',cat:0,loc:'',years:''};render()}}
